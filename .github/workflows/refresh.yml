name: refresh

on:
  schedule:
    # 每 15 分钟一次（UTC）。公有仓库 Actions 时长不限量；
    # 注意 GitHub 高峰期 scheduled 触发可能延迟几分钟，属正常现象
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}   # 允许 Actions 页面手动触发

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUOTE0_API_KEY: ${{ secrets.QUOTE0_API_KEY }}
      QUOTE0_DEVICE_ID: ${{ secrets.QUOTE0_DEVICE_ID }}
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      GLM_PLAN: cn
      QUOTE0_IMAGE_TASK_KEY: ${{ secrets.QUOTE0_IMAGE_TASK_KEY }}   # 多卡时绑定本仪表盘的卡
      DISPLAY_TZ: 'Asia/Shanghai'   # 时间戳显示时区（运行器默认 UTC）
      QUOTE0_REFRESH_NOW: 'true'
      QUOTE0_SWITCH_NEXT: 'true'
      QUOTE0_PREVIEW_PATH: tmp/preview.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies (pinned)
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Fetch GLM usage and push to Quote/0
        run: python quote0_glm.py
      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: tmp/preview.png
          retention-days: 3
